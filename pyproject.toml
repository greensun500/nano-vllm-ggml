[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanovllm-ggml"
version = "4.0.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "nanovllm-ggml: a lightweight native Qwen3.5 GGUF inference runtime"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy", "tqdm"]

[project.urls]
Homepage="https://github.com/greensun500/nano-vllm-ggml"

[project.scripts]
nanovllm-ggml-chat = "nanovllm.cli.chat:main"
nanovllm-ggml-bench = "nanovllm.cli.bench:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
